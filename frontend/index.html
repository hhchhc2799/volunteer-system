<!DOCTYPE html>
<html>
<head>
    <title> 我的网页 </title>
    <style>
    .LRcontainer
    {
        display: flex;
        gap: 150px;
    }
    </style>
</head>

<body>
    
    <h1 style="text-align: center;"> 开发组任务登记及志愿时长分配系统 </h1>

    <div class = "LRcontainer"> 
    
        <div> <!-- 左边一部分：人员管理、创建任务-->

        <h2> 人员管理 </h2> <!--人员管理 -->
            <div class = "LRcontainer"> 
                <div>
                    <h3> 添加组员 </h3>
                        <input id = "addpersonname" type = "text" placeholder="组员姓名">
                        <br>
                        <button id = "addpersonbutton"> 创建组员 </button>
                </div>
                <div>
                    <h3> 人员列表 </h3>
                     <table id = "personlist">
                        <tr>
                            <th> 人员 </th>
                            <th> 志愿时长 </th>
                            <th> 操作 </th>
                        </tr>
                    </table>
                </div>
            </div>
            
        <h2> 创建一个任务 </h2> <!-- 创建任务-->
            <input id = "taskcontent" type = "text" placeholder="任务内容"> 
            <br>
            <input id = "time" type = "text" placeholder="任务时间">
            <br>
            <h3> 选择人员 </h3>
            <div id = "choosepersonlist">
            </div>

            <br>
            <input id = "volunteertime" type = "text" placeholder="志愿时长">
            <br>
            <button id = "taskbutton"> 创建任务 </button>

        </div>
        
        <div> <!-- 右边一部分：任务列表-->

        <h2> 任务列表 </h2>
        <table id = "table">
            <tr>
                <th> 编号 </th>
                <th> 任务内容 </th>
                <th> 时间 </th>
                <th> 人员 </th>
                <th> 志愿时长 </th>
                <th> 操作 </th>
            </tr>
        </table>

        </div>

    </div>
    
    <script> 

    //添加人员
    let addpersonbutton = document.getElementById("addpersonbutton");
    let addpersonname = document.getElementById("addpersonname");
    let personlist = document.getElementById("personlist");
    
    let choosepersonlist = document.getElementById("choosepersonlist"); 

    addpersonbutton.onclick = function (){
        // 加入人员表格
        let ntr = document.createElement("tr");
        let ntd1 = document.createElement("td"); // 人员名字
        let ntd2 = document.createElement("td"); // 志愿时长
        let ntd3 = document.createElement("td"); // 操作
        let rmbutton = document.createElement("button"); 
        ntd1.textContent = addpersonname.value;
        ntd2.textContent = 0; //留志愿时长统计
        rmbutton.textContent = "删除";

        // 加入创建人员
        let newperson = document.createElement("div");
        let checkbox = document.createElement("input");
        let label = document.createElement("label");
        checkbox.type = "checkbox";
        checkbox.personname = addpersonname.value;
        label.textContent = addpersonname.value;
        newperson.appendChild(checkbox);
        newperson.appendChild(label);

        rmbutton.onclick = function()
        {
            ntr.remove();
            newperson.remove();
            //留删除人类函数
        };
        ntd3.appendChild(rmbutton);
        ntr.appendChild(ntd1);
        ntr.appendChild(ntd2);
        ntr.appendChild(ntd3);
        personlist.appendChild(ntr);
        choosepersonlist.appendChild(newperson);
    };

    //创建任务
    let taskcontent = document.getElementById("taskcontent");
    let time = document.getElementById("time");
    let volunteertime = document.getElementById("volunteertime");
    let taskbutton = document.getElementById("taskbutton");
    let table = document.getElementById("table");
    let rowcnt = 0;
    taskbutton.onclick = function (){
        let ntr = document.createElement("tr");
        let ntd1 = document.createElement("td"); // 编号
        let ntd2 = document.createElement("td"); // 任务内容
        let ntd3 = document.createElement("td"); // 时间
        let ntd4 = document.createElement("td");  // 人员
        let ntd5 = document.createElement("td"); // 志愿时长
        let ntd6 = document.createElement("td"); // 操作
        let rmbutton = document.createElement("button"); 

        // 获取参与的人员
        let stafftext = "";
        let checkboxes = document.querySelectorAll('input[type="checkbox"]');
        let selectedboxes = [];
        for (let i = 0; i < checkboxes.length; i++)
        {
            if (checkboxes[i].checked){
                if (stafftext != "") stafftext += "、";
                selectedboxes.push(checkboxes[i]);
                stafftext += checkboxes[i].personname;
            }
        }

        ntd1.textContent = ++rowcnt; 
        ntd2.textContent = taskcontent.value;
        ntd3.textContent = time.value;
        ntd4.textContent = stafftext;
        ntd5.textContent = volunteertime.value;
        rmbutton.textContent = "删除";
        rmbutton.onclick = function()
        {
            ntr.remove();
        };
        ntd6.appendChild(rmbutton);
        ntr.appendChild(ntd1);
        ntr.appendChild(ntd2);
        ntr.appendChild(ntd3);
        ntr.appendChild(ntd4);
        ntr.appendChild(ntd5);
        ntr.appendChild(ntd6);
        table.appendChild(ntr);
    };


    </script>

</body>
</html>

<!DOCTYPE html> <!-- HTML5 -->
<html> <!-- 网页开始 -->
<head> <!-- 头部开始 -->
    <title> 我的网页 </title> <!-- 网页标题 -->
    <style> /* CSS 开始 */
    .LRcontainer /* 左右布局 */
    { /* 开始 */
        display: flex; /* 横向排列 */
        gap: 150px; /* 左右间距 */
    } /* 结束 */
    </style> <!-- CSS 结束 -->
</head> <!-- 头部结束 -->

<body> <!-- 主体开始 -->
    
    <h1 style="text-align: center;"> 开发组任务登记及志愿时长分配系统 </h1> <!-- 网页标题 -->

    <div class = "LRcontainer"> <!-- 最外层左右布局 -->
    
        <div> <!-- 左边一部分：人员管理、创建任务 -->

        <h2> 人员管理 </h2> <!-- 人员管理 -->
            <div class = "LRcontainer"> <!-- 人员区域左右布局 -->
                <div> <!-- 添加组员 -->
                    <h3> 添加组员 </h3> <!-- 添加组员标题 -->
                        <input id = "addpersonname" type = "text" placeholder="组员姓名"> <!-- 输入姓名 -->
                        <br> <!-- 换行 -->
                        <button id = "addpersonbutton"> 创建组员 </button> <!-- 创建组员 -->
                </div> <!-- 添加组员结束 -->
                <div> <!-- 人员列表 -->
                    <h3> 人员列表 </h3> <!-- 人员列表标题 -->
                     <table id = "personlist"> <!-- 人员表格 -->
                        <tr> <!-- 表头 -->
                            <th> 人员 </th> <!-- 人员 -->
                            <th> 志愿时长 </th> <!-- 志愿时长 -->
                            <th> 操作 </th> <!-- 操作 -->
                        </tr> <!-- 表头结束 -->
                    </table> <!-- 人员表格结束 -->
                </div> <!-- 人员列表结束 -->
            </div> <!-- 人员区域结束 -->
            
        <h2> 创建一个任务 </h2> <!-- 创建任务 -->
            <input id = "taskcontent" type = "text" placeholder="任务内容"> <!-- 任务内容 -->
            <br> <!-- 换行 -->
            <input id = "time" type = "text" placeholder="任务时间"> <!-- 任务时间 -->
            <br> <!-- 换行 -->
            <h3> 选择人员 </h3> <!-- 选择人员 -->
            <div id = "choosepersonlist"> <!-- 选择人员区域 -->
            </div> <!-- 选择人员区域结束 -->

            <br> <!-- 换行 -->
            <input id = "volunteertime" type = "text" placeholder="志愿时长"> <!-- 志愿时长 -->
            <br> <!-- 换行 -->
            <button id = "taskbutton"> 创建任务 </button> <!-- 创建任务 -->

        </div> <!-- 左边结束 -->
        
        <div> <!-- 右边一部分：任务列表 -->

        <h2> 任务列表 </h2> <!-- 任务列表标题 -->
        <table id = "table"> <!-- 任务表格 -->
            <tr> <!-- 表头 -->
                <th> 编号 </th> <!-- 编号 -->
                <th> 任务内容 </th> <!-- 任务内容 -->
                <th> 时间 </th> <!-- 时间 -->
                <th> 人员 </th> <!-- 人员 -->
                <th> 志愿时长 </th> <!-- 志愿时长 -->
                <th> 操作 </th> <!-- 操作 -->
            </tr> <!-- 表头结束 -->
        </table> <!-- 任务表格结束 -->

        </div> <!-- 右边结束 -->

    </div> <!-- 最外层左右布局结束 -->
    
    <script> // JavaScript 开始

    // 获取页面元素
    let apiurl = "http://127.0.0.1:8000/api/v1";
    let personlist = document.getElementById("personlist");
    let choosepersonlist = document.getElementById("choosepersonlist");
    let table = document.getElementById("table");

    // 从后端获取数据
    async function getdata(url)
    {
        let response = await fetch(apiurl + url);
        if (!response.ok)
        {
            throw new Error("请求失败：" + response.status);
        }
        let result = await response.json();
        if (result.code != 200)
        {
            throw new Error(result.message || "获取数据失败");
        }
        return result.data;
    }

    // 清空表格中原有的数据，保留表头
    function clearlist(list)
    {
        while (list.rows.length > 1)
        {
            list.deleteRow(1);
        }
    }

    // 显示人员列表
    function showpersons(persons)
    {
        clearlist(personlist);
        choosepersonlist.replaceChildren();

        for (let i = 0; i < persons.length; i++)
        {
            let person = persons[i];

            let ntr = document.createElement("tr");
            let ntd1 = document.createElement("td");
            let ntd2 = document.createElement("td");
            let ntd3 = document.createElement("td");

            ntd1.textContent = person.name;
            ntd2.textContent = person.tothour;
            ntr.appendChild(ntd1);
            ntr.appendChild(ntd2);
            ntr.appendChild(ntd3);
            personlist.appendChild(ntr);

            let newperson = document.createElement("div");
            let checkbox = document.createElement("input");
            let label = document.createElement("label");

            checkbox.type = "checkbox";
            checkbox.personname = person.name;
            checkbox.personid = person.memberId;
            label.textContent = person.name;

            newperson.appendChild(checkbox);
            newperson.appendChild(label);
            choosepersonlist.appendChild(newperson);
        }
    }

    // 获取每个人参与过的任务，用于显示任务参与人员
    async function gettaskpersons(persons)
    {
        let taskpersons = {};

        await Promise.all(persons.map(async function(person)
        {
            try
            {
                let data = await getdata("/members/" + person.memberId + "/hours");
                let history = data.history.items;

                for (let i = 0; i < history.length; i++)
                {
                    let onehistory = history[i];
                    let key = JSON.stringify([onehistory.taskTitle, onehistory.tdate]);

                    if (!taskpersons[key])
                    {
                        taskpersons[key] = [];
                    }

                    if (taskpersons[key].indexOf(person.name) == -1)
                    {
                        taskpersons[key].push(person.name);
                    }
                }
            }
            catch (error)
            {
                console.error("获取人员任务历史失败：", error);
            }
        }));

        return taskpersons;
    }

    // 显示任务列表
    function showtasks(tasks, taskpersons)
    {
        clearlist(table);

        for (let i = 0; i < tasks.length; i++)
        {
            let task = tasks[i];
            let ntr = document.createElement("tr");
            let ntd1 = document.createElement("td");
            let ntd2 = document.createElement("td");
            let ntd3 = document.createElement("td");
            let ntd4 = document.createElement("td");
            let ntd5 = document.createElement("td");
            let ntd6 = document.createElement("td");

            let key = JSON.stringify([task.title, task.tdate]);
            let staff = taskpersons[key] || [];

            ntd1.textContent = task.id;
            ntd2.textContent = task.title;
            ntd3.textContent = task.tdate;
            ntd4.textContent = staff.length > 0 ? staff.join("、") : "暂无人员信息";
            ntd5.textContent = task.tothour;

            ntr.appendChild(ntd1);
            ntr.appendChild(ntd2);
            ntr.appendChild(ntd3);
            ntr.appendChild(ntd4);
            ntr.appendChild(ntd5);
            ntr.appendChild(ntd6);
            table.appendChild(ntr);
        }
    }

    // 页面打开时，加载后端中的人员和任务
    async function loadlists()
    {
        try
        {
            let persondata = await getdata("/hours/leaderboard");
            let taskdata = await getdata("/tasks");

            let persons = persondata.items || [];
            let tasks = taskdata.items || [];
            let taskpersons = await gettaskpersons(persons);

            showpersons(persons);
            showtasks(tasks, taskpersons);
        }
        catch (error)
        {
            console.error("加载人员列表和任务列表失败：", error);
            alert("加载失败，请检查后端是否正常运行，以及浏览器是否允许跨域请求。");
        }
    }

    loadlists();

    </script> <!-- JavaScript 结束 -->

</body> <!-- 主体结束 -->
</html> <!-- 网页结束 -->
